<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9d8df1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Food Tracker">
  <title>Historial</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-history">
  <main class="app-shell history-shell">
    <section class="header-card">
      <a class="back-link" href="index.html">&larr; Volver</a>
      <h1>Buscar historial <button class="info-btn" type="button" aria-label="Información" data-info-title="Buscar historial" data-info-body="Buscá entre todas tus entradas usando texto, tipo de registro o momento del día. Los resultados se agrupan por fecha.">ⓘ</button></h1>
      <p class="subcopy">Filtra comidas y sintomas por texto, tipo o momento del dia.</p>
    </section>

    <section class="form-card">
      <div class="filter-grid history-filter-grid">
        <label class="field-stack">
          <span class="field-label">Buscar <button class="info-btn" type="button" aria-label="Información" data-info-title="Buscar por texto" data-info-body="Filtrá las entradas que contienen este texto en el nombre de la comida, el síntoma o las notas.">ⓘ</button></span>
          <input class="text-input" id="historySearchInput" type="search" placeholder="Ej: yogurt, reflujo, nota...">
        </label>
        <label class="field-stack">
          <span class="field-label">Tipo <button class="info-btn" type="button" aria-label="Información" data-info-title="Tipo de registro" data-info-body="Mostrá solo comidas, solo síntomas, o ambos tipos de registros.">ⓘ</button></span>
          <select class="text-input" id="historyTypeFilter">
            <option value="all">Todo</option>
            <option value="food">Comidas</option>
            <option value="symptom">Sintomas</option>
          </select>
        </label>
        <label class="field-stack">
          <span class="field-label">Momento <button class="info-btn" type="button" aria-label="Información" data-info-title="Momento del día" data-info-body="Filtrá por la franja horaria del registro: desayuno (D), snack (S), almuerzo (A), merienda (M) o cena (C).">ⓘ</button></span>
          <select class="text-input" id="historyMealFilter">
            <option value="all">Todos</option>
            <option value="d">Desayuno</option>
            <option value="s">Snack</option>
            <option value="a">Almuerzo</option>
            <option value="m">Merienda</option>
            <option value="c">Cena</option>
          </select>
        </label>
      </div>

      <div class="timeline-header">
        <h3>Resultados <button class="info-btn" type="button" aria-label="Información" data-info-title="Resultados" data-info-body="Entradas que coinciden con los filtros activos, agrupadas por fecha. Tocá una entrada para editarla.">ⓘ</button></h3>
        <p id="historyCount"></p>
      </div>
      <div class="history-results" id="historyResults"></div>
    </section>
  </main>

  <script src="js/shared.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
