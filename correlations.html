<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9d8df1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Food Tracker">
  <title>Correlaciones</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-insights">
  <main class="app-shell insights-shell">
    <section class="header-card">
      <a class="back-link" href="index.html">&larr; Volver</a>
      <h1>Correlaciones</h1>
      <p class="subcopy">Compara comidas y sintomas por misma comida, mas tarde ese dia y al dia siguiente.</p>
    </section>

    <section class="form-card">
      <p class="section-title">Filtros</p>
      <div class="filter-grid">
        <label class="field-stack">
          <span class="field-label">Rango</span>
          <select class="text-input" id="rangeFilter">
            <option value="30">Ultimos 30 dias</option>
            <option value="90">Ultimos 90 dias</option>
            <option value="365">Ultimo ano</option>
            <option value="all">Todo</option>
          </select>
        </label>
        <label class="field-stack">
          <span class="field-label">Momento</span>
          <select class="text-input" id="mealFilter">
            <option value="all">Todas</option>
            <option value="d">Desayuno</option>
            <option value="s">Snack</option>
            <option value="a">Almuerzo</option>
            <option value="m">Merienda</option>
            <option value="c">Cena</option>
          </select>
        </label>
        <label class="field-stack">
          <span class="field-label">Minimo</span>
          <select class="text-input" id="minCountFilter">
            <option value="1">1 aparicion</option>
            <option value="2" selected>2 apariciones</option>
            <option value="3">3 apariciones</option>
            <option value="5">5 apariciones</option>
          </select>
        </label>
        <label class="field-stack">
          <span class="field-label">Ventana</span>
          <select class="text-input" id="windowFilter">
            <option value="meal">Solo misma comida</option>
            <option value="day">Mismo dia</option>
            <option value="next-day" selected>Mismo dia + dia siguiente</option>
          </select>
        </label>
      </div>
    </section>

    <section class="form-card matrix-section">
      <div class="timeline-header">
        <h3>Mapa de calor</h3>
        <p id="matrixCount"></p>
      </div>
      <div class="summary-grid" id="summaryGrid"></div>
      <p class="matrix-help">Cada celda muestra el porcentaje de veces que el sintoma aparece despues de esa comida. El color sube con el lift frente a tu linea base.</p>
      <div class="matrix-wrap" id="matrixWrap"></div>
    </section>

    <section class="form-card detail-section">
      <div class="detail-heading">
        <h3>Detalle</h3>
        <p id="detailBadge"></p>
      </div>
      <div id="detailPanel"></div>
    </section>
  </main>

  <script src="js/shared.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/correlations.js"></script>
</body>
</html>
