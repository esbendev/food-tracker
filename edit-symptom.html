<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#9d8df1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Food Tracker">
  <title>Editar sintoma</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-symptom">
  <main class="app-shell form-shell">
    <section class="header-card">
      <a class="back-link" id="backLink" href="index.html">&larr; Volver</a>
      <h1>Editar sintoma <button class="info-btn" type="button" aria-label="Información" data-info-title="Editar síntoma" data-info-body="Modificá el momento, los síntomas, la intensidad o las notas del registro existente. También podés eliminarlo con 'Eliminar síntoma'.">ⓘ</button></h1>
      <p class="subcopy" id="dateLabel"></p>
    </section>

    <section class="form-card">
      <div>
        <p class="section-title">Elige una comida <button class="info-btn" type="button" aria-label="Información" data-info-title="Momento del día" data-info-body="Indicá en qué franja horaria aparecieron los síntomas: D (desayuno), S (snack), A (almuerzo), M (merienda) o C (cena).">ⓘ</button></p>
        <div class="meal-group" id="mealGroup">
          <div class="meal-option"><input id="meal-d" name="meal" type="radio" value="d"><label for="meal-d">d</label></div>
          <div class="meal-option"><input id="meal-s" name="meal" type="radio" value="s"><label for="meal-s">s</label></div>
          <div class="meal-option"><input id="meal-a" name="meal" type="radio" value="a"><label for="meal-a">a</label></div>
          <div class="meal-option"><input id="meal-m" name="meal" type="radio" value="m"><label for="meal-m">m</label></div>
          <div class="meal-option"><input id="meal-c" name="meal" type="radio" value="c"><label for="meal-c">c</label></div>
        </div>
      </div>

      <div>
        <p class="section-title">Que estas sintiendo? <button class="info-btn" type="button" aria-label="Información" data-info-title="¿Qué estás sintiendo?" data-info-body="Actualizá la lista de síntomas. Al guardar, el registro original se reemplaza completamente.">ⓘ</button></p>
        <div class="inputs-stack" id="inputsStack"></div>
        <p class="hint">Actualiza la lista y guarda para reemplazar el registro.</p>
      </div>

      <div class="field-stack">
        <label class="field-label" for="severityInput">Intensidad <button class="info-btn" type="button" aria-label="Información" data-info-title="Intensidad del síntoma" data-info-body="Calicá qué tan fuerte es el síntoma del 1 al 5. Ayuda a detectar cuándo los síntomas son más intensos y comparar entre episodios.">ⓘ</button></label>
        <select class="text-input" id="severityInput">
          <option value="1">1 · Muy leve</option>
          <option value="2">2 · Leve</option>
          <option value="3">3 · Media</option>
          <option value="4">4 · Fuerte</option>
          <option value="5">5 · Muy fuerte</option>
        </select>
      </div>

      <div class="field-stack">
        <label class="field-label" for="noteInput">Notas <button class="info-btn" type="button" aria-label="Información" data-info-title="Notas opcionales" data-info-body="Editá el contexto adicional del registro: cuánto duró, qué lo alivió, circunstancias especiales.">ⓘ</button></label>
        <textarea class="text-input text-area" id="noteInput" rows="4" placeholder="Opcional: contexto, duracion, algo que ayude a recordar"></textarea>
      </div>

      <div class="button-row">
        <button class="ghost-button" id="addAnotherBtn" type="button">+ Agregar otro</button>
        <button class="ghost-button danger-button" id="deleteBtn" type="button">Eliminar sintoma</button>
        <button class="save-button" id="saveBtn" type="button">Guardar cambios</button>
      </div>
    </section>
  </main>

  <script src="js/shared.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/edit-symptom.js"></script>
</body>
</html>
